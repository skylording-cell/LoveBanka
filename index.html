<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Баночка любви ♡</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#09070d;--card:rgba(255,255,255,.075);--line:rgba(255,255,255,.12);
  --text:#fff7fb;--muted:#b9aab5;--pink:#ff77a9;--pink2:#ffb4cf;
}
body{margin:0;min-height:100vh;background:
radial-gradient(circle at 50% 15%,#3b1830 0,#170c18 35%,#09070d 72%);
color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;color:inherit}
.app{max-width:760px;margin:auto;padding:22px 16px 45px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.logo{font-weight:800;letter-spacing:.3px}.logo span{color:var(--pink)}
.counter{font-size:13px;color:var(--muted);background:var(--card);padding:9px 12px;border:1px solid var(--line);border-radius:999px}
.hero{text-align:center;padding:12px 0 20px}
h1{font-size:clamp(32px,9vw,58px);margin:8px 0 8px;letter-spacing:-1.8px}
.subtitle{color:var(--muted);margin:0 auto;max-width:520px;line-height:1.5}
.jar-wrap{height:390px;display:grid;place-items:center;position:relative}
.jar{width:205px;height:255px;animation:jarIdle 3.8s ease-in-out infinite;transform-origin:50% 92%;border:2px solid rgba(255,255,255,.38);border-radius:38px 38px 55px 55px;
background:linear-gradient(110deg,rgba(255,255,255,.16),rgba(255,119,169,.09) 45%,rgba(255,255,255,.035));
box-shadow:inset 15px 0 30px rgba(255,255,255,.06),0 20px 70px rgba(255,61,143,.16);
position:relative;backdrop-filter:blur(5px)}
.jar:before{content:"";position:absolute;width:166px;height:32px;left:18px;top:-25px;border:2px solid rgba(255,255,255,.35);
border-radius:12px;background:rgba(255,255,255,.1)}
.jar:after{content:"♡";position:absolute;inset:0;display:grid;place-items:center;font-size:88px;color:rgba(255,154,193,.65);
text-shadow:0 0 35px rgba(255,80,150,.5)}
.glow{position:absolute;width:270px;height:270px;border-radius:50%;background:rgba(255,70,145,.11);filter:blur(45px);z-index:-1}
.float{position:absolute;font-size:18px;opacity:.35;animation:float 5s ease-in-out infinite}
.f1{left:12%;top:22%}.f2{right:10%;top:35%;animation-delay:1s}.f3{left:23%;bottom:18%;animation-delay:2s}.f4{right:24%;bottom:12%;animation-delay:3s}
@keyframes float{50%{transform:translateY(-14px) rotate(8deg);opacity:.7}}
@keyframes jarIdle{0%,100%{transform:rotate(0deg) translateY(0)}35%{transform:rotate(-1.2deg) translateY(-2px)}70%{transform:rotate(1.2deg) translateY(-1px)}}
.actions{display:grid;gap:10px}
.main-btn{border:0;border-radius:18px;padding:16px 20px;background:linear-gradient(135deg,#ff5e9b,#d93679);
box-shadow:0 12px 30px rgba(255,55,130,.2);font-weight:800;cursor:pointer}
.main-btn:disabled{opacity:.45;cursor:not-allowed}
.secondary{border:1px solid var(--line);background:var(--card);padding:13px;border-radius:16px;cursor:pointer}
.note{text-align:center;color:var(--muted);font-size:13px;margin-top:12px}
.modal{position:fixed;inset:0;background:rgba(4,3,7,.78);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.modal.show{display:flex}
.panel{width:min(600px,100%);max-height:88vh;overflow:auto;background:#151018;border:1px solid var(--line);border-radius:25px;padding:20px;box-shadow:0 25px 90px rgba(0,0,0,.55)}
.close{float:right;border:0;background:transparent;font-size:26px;cursor:pointer}
.reason-card{padding:24px 20px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,119,169,.055));margin-top:20px}
.rarity{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.4px}
.reason{font-size:clamp(23px,6vw,36px);line-height:1.22;margin:15px 0 8px;font-weight:750}
.num{color:var(--muted);font-size:12px}
.filters{display:flex;gap:7px;overflow:auto;padding:6px 0 14px}
.filter{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 11px;cursor:pointer;font-size:12px}
.filter.active{background:rgba(255,119,169,.18);border-color:rgba(255,119,169,.45)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.item{padding:13px;border:1px solid var(--line);border-radius:15px;background:var(--card)}
.item.locked{opacity:.45}.item .r{font-size:10px;font-weight:800;letter-spacing:1px}.item p{font-size:13px;line-height:1.4;margin:7px 0 0}
.legend{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin:10px 0 18px}
.dot{display:inline-flex;align-items:center;gap:4px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#211820;border:1px solid var(--line);
padding:11px 15px;border-radius:999px;opacity:0;pointer-events:none;transition:.3s;z-index:50;font-size:13px}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.spark{position:fixed;pointer-events:none;animation:pop 900ms ease-out forwards;z-index:40}
@keyframes pop{0%{transform:translate(0,0) scale(.3);opacity:0}20%{opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(240deg);opacity:0}}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="logo">♡ <span>Баночка любви</span></div><div class="counter" id="counter">0 / 2500</div></div>
  <section class="hero">
    <h1>Причина на сегодня</h1>
    <p class="subtitle">Каждый день можно достать до трёх случайных причин. Собери их все — от обычных до мифических.</p>
  </section>
  <div class="jar-wrap">
    <div class="glow"></div><div class="float f1">♡</div><div class="float f2">✦</div><div class="float f3">♡</div><div class="float f4">✧</div>
    <div class="jar" id="jar"></div>
  </div>
  <div class="actions">
    <button class="main-btn" id="draw">Достать сегодняшнюю причину</button>
    <button class="secondary" id="inventory">Открыть коллекцию</button>
  </div>
  <div class="note" id="dailyNote"></div>
</div>

<div class="modal" id="reasonModal"><div class="panel">
  <button class="close" data-close>×</button><div id="reasonContent"></div>
</div></div>

<div class="modal" id="inventoryModal"><div class="panel">
  <button class="close" data-close>×</button>
  <h2>Коллекция</h2>
  <div class="legend">
    <span class="dot">⚪ Обычная</span><span class="dot">🟢 Необычная</span><span class="dot">🔵 Редкая</span>
    <span class="dot">🟣 Эпическая</span><span class="dot">🟡 Легендарная</span><span class="dot">🔴 Мифическая</span>
  </div>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const TOTAL=2500;
const rarities=[
 {name:"Обычная",icon:"⚪",weight:550,color:"#d8d8df"},
 {name:"Необычная",icon:"🟢",weight:250,color:"#7ee6a0"},
 {name:"Редкая",icon:"🔵",weight:120,color:"#7bbcff"},
 {name:"Эпическая",icon:"🟣",weight:60,color:"#c08cff"},
 {name:"Легендарная",icon:"🟡",weight:18,color:"#ffd76b"},
 {name:"Мифическая",icon:"🔴",weight:2,color:"#ff789d"}
];

// 50 × 50 = ровно 2500 уникальных причин.
// Фразы собраны из двух смысловых частей, чтобы каждая комбинация была отдельной коллекционной причиной.
const starts=[
"Мне нравится, как ты","Я люблю то, как ты","Я обожаю, когда ты","Мне бесконечно дорого, что ты","Я каждый раз улыбаюсь, когда ты",
"Мне спокойно рядом, когда ты","Я восхищаюсь тем, как ты","Мне нравится замечать, как ты","Я особенно люблю моменты, когда ты","Ты заставляешь меня любить то, как ты",
"Мне нравится слышать, как ты","Я люблю смотреть, как ты","Мне дорого, что ты умеешь","Я обожаю твою способность","Мне нравится твоя привычка",
"Я люблю даже то, как ты","Мне нравится, что рядом с тобой я","Я ценю, что ты","Мне нравится ощущение, когда ты","Я счастлив оттого, что ты",
"Мне нравится, как рядом с тобой","Я люблю моменты, в которых ты","Мне нравится, что ты умеешь","Я обожаю, когда благодаря тебе я","Мне дорого каждое мгновение, когда ты",
"Я люблю, что ты умеешь","Мне нравится видеть, как ты","Я ценю даже маленькие моменты, когда ты","Мне нравится, что с тобой я могу","Я люблю твою способность делать так, что я",
"Мне нравится, когда твой голос","Я люблю то чувство, которое появляется, когда ты","Мне дорого, что ты всегда умеешь","Я обожаю, как легко ты","Мне нравится, что ты можешь",
"Я люблю, когда ты случайно","Мне нравится, как ты иногда","Я ценю, что ты способен(на)","Мне нравится твоя манера","Я люблю тот момент, когда ты",
"Мне дорого, как ты","Я обожаю, что ты можешь","Мне нравится, когда благодаря тебе","Я люблю, что после тебя","Мне нравится, что с тобой даже",
"Я ценю, как ты","Мне особенно нравится, что ты","Я люблю то, что ты умеешь","Мне нравится, как от тебя","Я обожаю ощущение, когда ты"
];
const ends=[
"заставляешь меня улыбаться даже без причины.",
"умеешь превращать самый обычный день в маленькое событие.",
"остаёшься собой, даже когда никто этого не ждёт.",
"смотришь на меня так, будто в мире больше ничего не нужно.",
"умеешь находить смешное там, где я уже перестал его видеть.",
"делаешь тишину между нами уютной, а не неловкой.",
"можешь одним сообщением полностью изменить моё настроение.",
"замечаешь мелочи, которые другие обычно пропускают.",
"рядом со мной можешь быть настоящей, без масок и притворства.",
"напоминаешь мне, что счастье иногда помещается в одном человеке.",
"умеешь говорить именно те слова, которые мне нужны.",
"смеёшься, и мне хочется запомнить этот звук навсегда.",
"умеешь заботиться так естественно, будто это самая простая вещь на свете.",
"делаешь меня мягче, добрее и счастливее.",
"имеешь свои маленькие странности — и именно за них я тебя люблю.",
"можешь быть невероятно милой, даже когда совершенно этого не замечаешь.",
"позволяешь мне чувствовать себя дома рядом с тобой.",
"остаёшься в моих мыслях ещё долго после нашей встречи.",
"делаешь обычные воспоминания такими, которые хочется беречь.",
"умеешь быть одновременно сильной и удивительно нежной.",
"можешь рассмешить меня именно в тот момент, когда это невозможно.",
"смотришь на знакомые вещи так, что они становятся интереснее.",
"умеешь поддержать меня, даже если я не знаю, как объяснить, что происходит.",
"придаёшь значение самым маленьким деталям.",
"делаешь моё «сегодня» немного лучше, чем было вчера.",
"умеешь быть рядом не только словами, но и самим своим присутствием.",
"заставляешь меня замечать красоту в самых обычных вещах.",
"можешь сделать один короткий разговор событием всего моего дня.",
"никогда не перестаёшь удивлять меня чем-то новым.",
"умеешь быть смешной именно тогда, когда я меньше всего этого ожидаю.",
"даришь мне чувство, что меня действительно видят и понимают.",
"можешь одним взглядом сказать больше, чем длинный разговор.",
"умеешь превращать маленькие моменты в большие воспоминания.",
"остаёшься для меня человеком, к которому хочется возвращаться.",
"делаешь моё сердце немного спокойнее одним своим присутствием.",
"можешь быть невероятно красивой даже тогда, когда сама этого не замечаешь.",
"умеешь принимать мои странности и не заставляешь меня скрывать их.",
"оставляешь после себя тепло, которое не исчезает сразу.",
"можешь заставить меня скучать по тебе всего через пять минут после прощания.",
"умеешь сделать так, чтобы рядом с тобой время проходило слишком быстро.",
"сохраняешь в себе что-то настоящее, что невозможно подделать.",
"можешь подарить мне ощущение праздника совершенно обычным вечером.",
"учишь меня ценить то, что раньше казалось мелочью.",
"делаешь меня счастливым просто тем, что существуешь в моей жизни.",
"умеешь быть человеком, которого хочется обнимать без всякой причины.",
"заставляешь меня строить в голове маленькие планы, в которых есть мы.",
"можешь одновременно успокоить моё сердце и заставить его биться быстрее.",
"оставляешь в моей памяти моменты, которые я не хочу отпускать.",
"для меня становишься всё дороже с каждым новым днём."
];

const reasons=Array.from({length:TOTAL},(_,i)=>{
 const s=starts[Math.floor(i/50)], e=ends[i%50];
 let rarity;
 const n=i+1;
 if(n<=1375) rarity=0; else if(n<=2000) rarity=1; else if(n<=2300) rarity=2; else if(n<=2450) rarity=3; else if(n<=2495) rarity=4; else rarity=5;
 return {id:n,text:"Катя, "+s[0].toLowerCase()+s.slice(1)+" "+e,rarity};
});
const key="loveJarCollection_v1";
let state=JSON.parse(localStorage.getItem(key)||'{"collected":[],"lastDate":null,"drawsToday":0}');
if(typeof state.drawsToday!=="number") state.drawsToday=0;
const today=()=>new Date().toLocaleDateString("sv-SE");
if(state.lastDate!==today()){ state.drawsToday=0; state.lastDate=today(); save(); }
const save=()=>localStorage.setItem(key,JSON.stringify(state));
const collectedSet=()=>new Set(state.collected);
const rarityOf=r=>rarities[r];
function weightedRarity(){
 let x=Math.random()*1000;
 let acc=0;
 for(let i=0;i<rarities.length;i++){acc+=rarities[i].weight;if(x<acc)return i}
 return 0;
}
function pickReason(){
 // Preferably choose an unseen reason of the rolled rarity; after the first 2500 are exhausted, fall back to any unseen.
 const set=collectedSet(), r=weightedRarity();
 let candidates=reasons.filter(x=>x.rarity===r&&!set.has(x.id));
 if(!candidates.length)candidates=reasons.filter(x=>!set.has(x.id));
 return candidates[Math.floor(Math.random()*candidates.length)];
}
function update(){
 document.getElementById("counter").textContent=`${state.collected.length} / ${TOTAL}`;
 const can=state.drawsToday<3 && state.collected.length<TOTAL;
 document.getElementById("draw").disabled=!can;
 document.getElementById("draw").textContent=can?`Достать причину · ${3-state.drawsToday} ${3-state.drawsToday===1?"осталась":"осталось"}`:"На сегодня всё ♡";
 document.getElementById("dailyNote").textContent=state.collected.length>=TOTAL?"Ты собрал(а) все 2500 причин. ♡":`Сегодня можно достать ещё ${Math.max(0,3-state.drawsToday)} ${Math.max(0,3-state.drawsToday)===1?"причину":"причины"}.`;
}
function showReason(reason){
 const r=rarityOf(reason.rarity);
 document.getElementById("reasonContent").innerHTML=`
 <div class="rarity" style="color:${r.color}">${r.icon} ${r.name}</div>
 <div class="reason">${reason.text}</div>
 <div class="num">Причина №${String(reason.id).padStart(4,"0")} · ${state.collected.length} / ${TOTAL} собрано</div>`;
 document.getElementById("reasonModal").classList.add("show");
 burst(reason.rarity);
}
function burst(level){
 const count=level>=5?42:level>=4?25:level>=3?16:10;
 for(let i=0;i<count;i++){
   const s=document.createElement("div");s.className="spark";s.textContent=level>=4?"✦":"♡";
   s.style.left="50%";s.style.top="50%";
   s.style.setProperty("--x",`${(Math.random()-.5)*window.innerWidth*.8}px`);
   s.style.setProperty("--y",`${(Math.random()-.5)*window.innerHeight*.7}px`);
   document.body.appendChild(s);setTimeout(()=>s.remove(),950);
 }
}
document.getElementById("draw").onclick=()=>{
 if(state.lastDate!==today()){state.drawsToday=0;state.lastDate=today();}
 if(state.drawsToday>=3||state.collected.length>=TOTAL)return;
 const reason=pickReason();
 const jar=document.getElementById("jar");
 jar.animate([{transform:"rotate(0deg) scale(1)"},{transform:"rotate(-2deg) scale(1.025)"},{transform:"rotate(2deg) scale(1.025)"},{transform:"rotate(0deg) scale(1)"}],{duration:420,easing:"ease-out"});
 state.collected.push(reason.id);state.drawsToday++;state.lastDate=today();save();update();showReason(reason);
};
document.getElementById("inventory").onclick=()=>{
 document.getElementById("inventoryModal").classList.add("show");renderInventory(99);
};
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>b.closest(".modal").classList.remove("show"));
document.querySelectorAll(".modal").forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove("show")});

let active=99;
function renderInventory(filter){
 active=filter;
 const filters=document.getElementById("filters");
 filters.innerHTML=`<button class="filter ${filter===99?"active":""}" data-f="99">Все</button>
 <button class="filter ${filter===100?"active":""}" data-f="100">✓ Найденные</button>
 <button class="filter ${filter===101?"active":""}" data-f="101">🔒 Не найденные</button>`+
 rarities.map((r,i)=>`<button class="filter ${filter===i?"active":""}" data-f="${i}">${r.icon} ${r.name}</button>`).join("");
 filters.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>renderInventory(Number(b.dataset.f)));
 const set=collectedSet();
 const visible=reasons.filter(x=>{
  const found=set.has(x.id);
  if(filter===100) return found;
  if(filter===101) return !found;
  return filter===99||x.rarity===filter;
});
 document.getElementById("grid").innerHTML=visible.map(x=>{
  const r=rarityOf(x.rarity), ok=set.has(x.id);
  return `<div class="item ${ok?"":"locked"}"><div class="r" style="color:${r.color}">${ok?r.icon+" "+r.name:"🔒 НЕ НАЙДЕНО"}</div>
  <p>${ok?x.text:"Эта причина пока спрятана в баночке."}</p></div>`;
 }).join("");
}
update();
</script>
</body>
</html>
